name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/nexus --locked
      - run: pnpm verify
      - run: pnpm --dir studio exec playwright install --with-deps chromium
      - run: pnpm smoke

