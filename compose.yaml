name: openfde

x-nexus-environment: &nexus-environment
  DATABASE_URL: postgresql+psycopg://openfde:openfde@postgres:5432/openfde
  NEXUS_API_KEY: ${NEXUS_API_KEY:-openfde-local-dev-key}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openfde
      POSTGRES_PASSWORD: openfde
      POSTGRES_USER: openfde
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfde -d openfde"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${NEXUS_DB_PORT:-55432}:5432"
    volumes:
      - nexus-postgres-data:/var/lib/postgresql/data

  nexus-migrate:
    image: openfde-nexus:dev
    build:
      context: ./services/nexus
    command: ["alembic", "upgrade", "head"]
    environment: *nexus-environment
    depends_on:
      postgres:
        condition: service_healthy

  nexus-seed:
    image: openfde-nexus:dev
    pull_policy: never
    command: ["python", "-m", "app.seed.generate"]
    environment: *nexus-environment
    depends_on:
      nexus-migrate:
        condition: service_completed_successfully

  nexus:
    image: openfde-nexus:dev
    pull_policy: never
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment: *nexus-environment
    depends_on:
      nexus-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${NEXUS_API_PORT:-8000}:8000"
    volumes:
      - ./services/nexus/app:/app/app

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: openfde_test
      POSTGRES_PASSWORD: openfde
      POSTGRES_USER: openfde
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfde -d openfde_test"]
      interval: 1s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${NEXUS_TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  nexus-postgres-data:
